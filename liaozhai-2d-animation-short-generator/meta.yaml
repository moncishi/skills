summary-en: Turn a story idea into a complete Liaozhai-inspired Chinese 2D animated short.
summary-cn: 根据故事创意，完成人物与场景设定、镜头规划、分镜生成和视频合成，输出风格统一的聊斋式中国二维动画短片。
desc-en: Designed for creators who want to turn a story idea into a complete Liaozhai-inspired Chinese 2D animated short. Users provide a one-line concept or basic plot and confirm aspect ratio, duration, dialogue needs, and visual direction. The Skill creates a project brief and story outline, builds labeled character and environment-only scene cards, plans a shot table with per-second action, camera, audio, and continuity requirements, produces text storyboards or optional pencil boards, selects a video model, generates individual shots, assembles the film, matches BGM, and performs a final review. It outputs a coherent ink-and-color film with consistent characters, continuous planar staging, and controlled limited-animation pacing. Best for Chinese supernatural folklore, ironic moral tales, period fantasy, and social shorts; not for single images, simple retouching, photorealistic live action, 3D rendering, or one standalone clip.
desc-cn: 面向希望将故事灵感制作成完整聊斋式中国二维动画短片的创作者。用户需提供一句故事创意或基础剧情，并确认画面比例、总时长、对白需求和目标风格。Skill 会依次完成项目简报与故事大纲，生成带标注的角色卡和无人物场景卡，规划带每秒动作、镜头、音频与连续性要求的镜头表，制作文本分镜或可选铅笔分镜，再选择视频模型生成单镜头片段，完成全片拼接、BGM匹配和成片复查。最终输出平涂色块、工笔线描、水墨设色、平面调度和有限动画节奏统一的二维短片。适用于中国志怪、寓言讽刺、古典幻想和社交媒体短片，不适用于单张图片、简单修图、真人写实视频、3D渲染或仅生成一个独立镜头。
